<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Amira 🤍</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:black;
  color:white;
  font-family:Courier, monospace;
  overflow:hidden;
}

section{
  display:none;
  min-height:100vh;
  padding:25px;
  text-align:center;
}

.active{display:block}

h1{font-size:2.5em;margin-bottom:20px}
h2{font-size:1.8em;margin-bottom:15px}

button{
  padding:18px 28px;
  font-size:20px;
  border:none;
  border-radius:15px;
  background:#00ffd5;
  color:black;
  margin:10px;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

canvas{
  position:fixed;
  inset:0;
  z-index:-1;
}

/* typing */
.type{
  white-space:pre-wrap;
  border-right:3px solid #0f0;
  animation:blink .7s infinite;
  font-size:1.3em;
}
@keyframes blink{50%{border-color:transparent}}

/* gallery */
.gallery{
  display:flex;
  flex-direction:column;
  gap:15px;
}
.gallery img{
  width:100%;
  border-radius:15px;
  cursor:pointer;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal img{max-width:90%}
.modal span{
  position:absolute;
  top:20px;right:25px;
  font-size:30px;
  cursor:pointer;
}

/* balloons */
.balloons::before{
  content:"🎈🎈🎈🎈🎈";
  font-size:45px;
  display:block;
  margin-bottom:15px;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<audio id="intro" src="cancion.mp3"></audio>
<audio id="photosMusic" src="music.mp3"></audio>
<audio id="letterMusic" src="song.mp3"></audio>
<audio id="click" src="click.mp3"></audio>

<!-- PLAY -->
<section id="play" class="active">
  <h1>PRESS PLAY ▶</h1>
  <button onclick="fx();startIntro()">▶</button>
</section>

<!-- INTRO -->
<section id="intro">
  <img src="torta.png" width="180"><br><br>
  <div id="introText" class="type"></div><br><br>
  <div id="timer">15</div>
  <p>Wait to continue…</p>
  <button id="nextBtn" disabled onclick="fx();goGift()">NEXT</button>
</section>

<!-- GIFT QUESTION -->
<section id="gift">
  <h1>🎉 HAPPY BIRTHDAY AMIRA 🎉</h1>
  <h2>Do you want to open your gift?</h2>
  <button onclick="fx();openMenu()">YES PLEASE</button>
  <button onclick="fx();openNo()">NO THANKS</button><br>
  <button onclick="fx();backIntro()">RETURN</button>
</section>

<!-- NO -->
<section id="no">
  <h2>I promise you’ll like it 😏</h2>
  <img src="photo7.jpg" width="250"><br>
  <button onclick="fx();openMenu()">TRY AGAIN</button>
</section>

<!-- MENU -->
<section id="menu">
  <h1>THIS IS FOR YOU 🌠</h1>
  <button onclick="fx();openPhotos()">📸 MOMENTS</button>
  <button onclick="fx();openLetter()">💌 LETTER</button>
  <button onclick="fx();openGift()">🎁 GIFT</button><br>
  <button onclick="fx();backGift()">RETURN</button>
</section>

<!-- PHOTOS -->
<section id="photos">
  <h2>Moments 🤍</h2>
  <div class="gallery">
    <img src="photo1.jpg" onclick="openImg(this)">
    <img src="photo2.jpg" onclick="openImg(this)">
    <img src="photo3.jpg" onclick="openImg(this)">
    <img src="photo4.jpg" onclick="openImg(this)">
    <img src="photo5.jpg" onclick="openImg(this)">
    <img src="photo6.jpg" onclick="openImg(this)">
    <img src="photo8.jpg" onclick="openImg(this)">
    <img src="photo9.jpg" onclick="openImg(this)">
  </div>
  <button onclick="fx();stopAll();openMenu()">RETURN</button>
</section>

<!-- LETTER -->
<section id="letter" class="balloons">
  <img src="parrot.gif" width="130"><br><br>
  <div id="letterText" class="type"></div><br>
  <button onclick="fx();stopAll();openMenu()">RETURN</button>
</section>

<!-- GIFT ROBUX -->
<section id="giftBox">
  <h2>Your Robux will arrive on January 15 🎁✨</h2>
  <img src="photo4.jpg" width="250"><br>
  <button onclick="fx();openMenu()">RETURN</button>
</section>

<div class="modal" id="modal">
  <span onclick="closeImg()">✖</span>
  <img id="modalImg">
</div>

<script>
const intro=document.getElementById("intro");
const introAudio=document.getElementById("intro");

function fx(){click.play()}
function show(id){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function stopAll(){
  introAudio.pause();photosMusic.pause();letterMusic.pause();
}

// intro
function startIntro(){
  introAudio.play();
  show("intro");
  type("introText","Amira...\nToday is your birthday.\nSo I made this interactive coding gift for you.\n(◕‿◕)っ🎔");
  let t=15;
  const timer=setInterval(()=>{
    document.getElementById("timer").textContent=t;
    t--;
    if(t<0){
      clearInterval(timer);
      document.getElementById("nextBtn").disabled=false;
    }
  },1000);
}

function goGift(){show("gift")}
function backIntro(){show("intro")}

// menu
function openMenu(){show("menu")}
function openNo(){show("no")}
function backGift(){show("gift")}

// photos
function openPhotos(){
  stopAll();photosMusic.play();
  show("photos");
}

// letter
function openLetter(){
  stopAll();letterMusic.play();
  show("letter");
  type("letterText",
`Hoy te celebro 🤍

Celebro tu vida y este nuevo año, lleno de sorpresas y caminos por descubrir. Aunque nuestros mundos estén tan lejos, tú desde Argelia, yo desde un rincón de Latinoamérica, me maravilla la belleza de tu mundo: tu cultura, tu idioma, tu manera tan única de existir, tan distinta a la mía.

Me alegra profundamente haberte conocido, desde aquel encuentro del año pasado. Ya te lo he dicho antes, pero de verdad me sorprende quién eres: cómo vives tu fe, lo amable y correcta que eres, la calma que transmites sin esfuerzo.

Deseo que tu mente esté llena de sueños por cumplir y que tengas la valentía de vivir la vida con intensidad y libertad...

Gracias a Dios por tu existir. Te deseo salud, paz, felicidad y muchos momentos que te hagan sonreír… hoy y siempre.`);
}

// gift
function openGift(){show("giftBox")}

// typing
function type(id,text){
  let i=0;
  const el=document.getElementById(id);
  el.textContent="";
  const t=setInterval(()=>{
    el.textContent+=text[i];
    i++;
    if(i>=text.length)clearInterval(t);
  },40);
}

// images
function openImg(img){
  modal.style.display="flex";
  modalImg.src=img.src;
}
function closeImg(){modal.style.display="none"}

// matrix
const c=document.getElementById("matrix");
const ctx=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;
const cols=Math.floor(c.width/20);
const drops=Array(cols).fill(0);
function matrix(){
  ctx.fillStyle="rgba(0,0,0,.05)";
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle="#0f0";
  drops.forEach((y,i)=>{
    const txt=Math.random()>0.5?"0":"1";
    ctx.fillText(txt,i*20,y);
    drops[i]=y>c.height?0:y+20;
  });
}
setInterval(matrix,50);
</script>

</body>
</html>
