<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Amira</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:black;
  color:white;
  font-family:Courier, monospace;
  overflow-x:hidden;
}

canvas{
  position:fixed;
  inset:0;
  z-index:0;
}

section{
  min-height:100vh;
  padding:30px 16px;
  display:none;
  position:relative;
  z-index:1;
  text-align:center;
}

.active{display:block}

h1{font-size:2.8rem;margin-bottom:15px}
h2{font-size:1.7rem;margin-bottom:15px}

button{
  padding:18px 30px;
  font-size:1.3rem;
  margin:12px;
  border:none;
  border-radius:16px;
  background:white;
  color:black;
  cursor:pointer;
}

.big{font-size:3.4rem}

.card-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-top:30px;
}

.card{
  background:rgba(255,255,255,0.1);
  border:2px solid white;
  padding:45px 10px;
  font-size:1.6rem;
  border-radius:20px;
}

.torta{
  width:220px;
  animation:fade 2s ease;
}

@keyframes fade{
  from{opacity:0;transform:scale(.8)}
  to{opacity:1;transform:scale(1)}
}

.matrixText{
  margin-top:20px;
  font-size:1.3rem;
  min-height:120px;
}

.timer{margin-top:10px;font-size:1.2rem}

.gallery{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
}

.gallery img{
  width:46%;
  border-radius:14px;
  cursor:pointer;
}

.full{
  position:fixed;
  inset:0;
  background:black;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:5;
}

.full img{max-width:90%;max-height:90%}
.close{position:absolute;top:20px;right:20px;font-size:2rem;color:white}

.letter{
  font-size:1.3rem;
  line-height:1.9;
  text-align:right;
  direction:rtl;
  margin-top:20px;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<audio id="intro" src="cancion.mp3"></audio>
<audio id="song" src="song.mp3"></audio>
<audio id="click" src="click.mp3"></audio>

<section id="start" class="active">
  <h1 class="big">PRESS PLAY</h1>
  <button onclick="playIntro()">▶ PLAY</button>
</section>

<section id="torta">
  <img src="torta.png" class="torta">
  <div class="matrixText" id="typeText"></div>
  <div class="timer" id="timer">wait… 15</div>
  <button id="nextBtn" disabled onclick="go('question')">NEXT</button>
</section>

<section id="question">
  <h1 class="big">🎉 HAPPY BIRTHDAY 👑</h1>
  <h2>Do you want to open your gift?</h2>
  <button onclick="yes()">Yes please</button>
  <button onclick="no()">No thanks</button>
</section>

<section id="promise">
  <h2>I promise you’ll like it (っ ͡❛ 𝆒 ͡❛)っ🎔</h2>
  <img src="photo7.jpg" width="230" style="margin:20px">
  <button onclick="go('question')">Return</button>
</section>

<section id="menu">
  <h1>THIS IS FOR YOU ⭐</h1>
  <div class="card-grid">
    <div class="card" onclick="openPhotos()">📸 MOMENTS</div>
    <div class="card" onclick="openLetter()">💌 LETTER</div>
    <div class="card" onclick="openGift()">🎁 GIFT</div>
  </div>
  <button onclick="go('question')">Return</button>
</section>

<section id="photos">
  <h2>Moments ✨</h2>
  <div class="gallery">
    <img src="photo1.jpg" onclick="zoom(this)">
    <img src="photo2.jpg" onclick="zoom(this)">
    <img src="photo3.jpg" onclick="zoom(this)">
    <img src="photo4.jpg" onclick="zoom(this)">
    <img src="photo5.jpg" onclick="zoom(this)">
    <img src="photo6.jpg" onclick="zoom(this)">
    <img src="photo7.jpg" onclick="zoom(this)">
    <img src="photo8.jpg" onclick="zoom(this)">
    <img src="photo9.jpg" onclick="zoom(this)">
  </div>
  <button onclick="backMenu()">Return</button>
</section>

<section id="letter">
  <img src="parrot.gif" width="120">
  <div class="letter" id="letterText"></div>
  <button onclick="backMenu()">Return</button>
</section>

<section id="gift">
  <h2>Your Robux will arrive on January 15 🎁🤍📅🤗</h2>
  <img src="photo4.jpg" width="230">
  <button onclick="backMenu()">Return</button>
</section>

<div class="full" id="full">
  <span class="close" onclick="closeFull()">✕</span>
  <img id="fullImg">
</div>

<script>
/* MATRIX like stars */
const c=document.getElementById("matrix"),ctx=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;
const drops=Array(120).fill(0).map(()=>Math.random()*c.height);
function draw(){
  ctx.fillStyle="rgba(0,0,0,0.15)";
  ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle="white";
  ctx.font="14px monospace";
  drops.forEach((y,i)=>{
    const x=(i*17)%c.width;
    ctx.fillText(Math.random()>0.5?"0":"1",x,y);
    drops[i]=y>c.height?0:y+10;
  });
}
setInterval(draw,50);

/* AUDIO */
const intro=document.getElementById("intro");
const song=document.getElementById("song");
const click=document.getElementById("click");
const sound=()=>click.play();

/* NAV */
function go(id){
  sound();
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function playIntro(){
  sound(); intro.play(); go("torta"); typeWriter(); startTimer();
}

function yes(){sound(); go("menu")}
function no(){sound(); go("promise")}

function openPhotos(){sound(); intro.pause(); song.play(); go("photos")}
function openLetter(){sound(); intro.pause(); song.play(); writeLetter(); go("letter")}
function openGift(){sound(); intro.pause(); go("gift")}
function backMenu(){song.pause(); go("menu")}

/* TYPE */
const txt="Amira… Today is your birthday. I coded this just for you 💻";
let i=0;
function typeWriter(){
  if(i<txt.length){
    typeText.innerHTML+=txt[i++];
    setTimeout(typeWriter,80);
  }
}

/* TIMER */
let t=15;
function startTimer(){
  const int=setInterval(()=>{
    timer.innerText="wait… "+(--t);
    if(t<=0){clearInterval(int);nextBtn.disabled=false;timer.innerText="you can continue";}
  },1000);
}

/* LETTER */
const letter=`اليوم نحتفل بيك 🤍

نحتفل بحياتك وبهاد العام الجديد، عام مليان مفاجآت وطرق جديدة تكتشفيها. رغم اللي عوالمنا بعيدة بزاف — إنتِ من الجزائر وأنا من ركن صغير في أمريكا اللاتينية — دايمًا يعجبني جمال عالمك: ثقافتك، لغتك، وطريقتك الخاصة في الوجود، المختلفة بزاف عني.

فرحانة بزاف إني عرفتك، من ذاك اللقاء اللي كان العام اللي فات. قلتها لك قبل، وبصح لازم نعاود نقولها: فعلاً تدهشيني بشخصك، بطريقة عيشك لإيمانك، بلطفك، وبالهدوء اللي تنشريه من غير ما تحاولي. معرفتك كانت حاجة بسيطة بصح بقات في القلب، وتجربة مميزة بزاف.

نتمنى يكون بالك عامر بالأحلام اللي حابة تحققيها، ويكون عندك الشجاعة تعيشي حياتك بحرية وبعمق، خاطر هكذا نشوف معنى الحياة: نحسّ بلا خوف، نتعلم ونكبر في كل خطوة… ونخلي اللي صادق يلقى وقته وطريقه.

أمنياتي بزاف، حتى لو كلماتي قليلة.

نحمد ربي على وجودك، ونتمنالك الصحة، الراحة، السعادة، ولحظات بزاف تخليك تبتسمي… اليوم ودومًا.`;

let j=0;
function writeLetter(){
  letterText.innerHTML="";
  j=0;
  (function t(){
    if(j<letter.length){
      letterText.innerHTML+=letter[j++];
      setTimeout(t,55);
    }
  })();
}

/* IMAGES */
function zoom(img){
  full.style.display="flex";
  fullImg.src=img.src;
}
function closeFull(){full.style.display="none";}
</script>

</body>
</html>
