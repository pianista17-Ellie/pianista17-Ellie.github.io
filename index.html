<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Amira 🤍</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family: 'Courier New', monospace;
  background:black;
  color:#fff;
  overflow:hidden;
}

section{
  display:none;
  min-height:100vh;
  padding:30px;
  text-align:center;
}

.active{display:block}

button{
  background:#00ffcc;
  border:none;
  padding:15px 25px;
  margin:10px;
  font-size:18px;
  border-radius:12px;
  cursor:pointer;
}

h1,h2{margin-bottom:20px}

.matrix{
  position:fixed;
  inset:0;
  z-index:-1;
}

canvas{width:100%;height:100%}

/* escritura */
.type{
  border-right:2px solid #0f0;
  white-space:pre-wrap;
  overflow:hidden;
  animation: blink .7s infinite;
}
@keyframes blink{50%{border-color:transparent}}

.gallery img{
  width:100%;
  max-width:300px;
  margin:10px;
  border-radius:15px;
  cursor:pointer;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal img{max-width:90%}
.modal span{
  position:absolute;top:20px;right:30px;
  font-size:30px;cursor:pointer
}

/* globos */
.balloons::before{
  content:"🎈🎈🎈🎈🎈";
  font-size:40px;
  animation: float 5s infinite;
}
@keyframes float{
  0%{transform:translateY(0)}
  50%{transform:translateY(-20px)}
  100%{transform:translateY(0)}
}
</style>
</head>

<body>

<canvas class="matrix"></canvas>

<!-- audios -->
<audio id="intro" src="cancion.mp3"></audio>
<audio id="photosMusic" src="music.mp3"></audio>
<audio id="letterMusic" src="song.mp3"></audio>
<audio id="clickSound" src="click.mp3"></audio>

<!-- PLAY -->
<section id="play" class="active">
  <h1>PRESS PLAY ▶</h1>
  <button onclick="clickFx();start()">▶</button>
</section>

<!-- INTRO -->
<section id="introText">
  <img src="torta.png" width="180"><br><br>
  <div id="typed" class="type"></div><br>
  <button onclick="clickFx();toGift()">NEXT</button>
</section>

<!-- GIFT -->
<section id="gift">
  <h1>👑 HAPPY BIRTHDAY AMIRA 👑</h1>
  <h2>Do you want to open your gift?</h2>
  <button onclick="clickFx();yes()">YES PLEASE</button>
  <button onclick="clickFx();no()">NO THANKS</button><br>
  <button onclick="clickFx();backIntro()">RETURN</button>
</section>

<!-- NO -->
<section id="nope">
  <h2>I promise you’ll like it 😏</h2>
  <img src="photo7.jpg" width="250"><br>
  <button onclick="clickFx();toGift()">TRY AGAIN</button>
</section>

<!-- MENU -->
<section id="menu">
  <button onclick="clickFx();photos()">📸 MOMENTS</button>
  <button onclick="clickFx();letter()">💌 LETTER</button><br>
  <button onclick="clickFx();toGift()">BACK</button>
</section>

<!-- PHOTOS -->
<section id="photos">
  <h2>✨ Our Moments ✨</h2>
  <div class="gallery">
    <img src="photo1.jpg" onclick="openImg(this)">
    <img src="photo2.jpg" onclick="openImg(this)">
    <img src="photo3.jpg" onclick="openImg(this)">
    <img src="photo4.jpg" onclick="openImg(this)">
    <img src="photo5.jpg" onclick="openImg(this)">
    <img src="photo6.jpg" onclick="openImg(this)">
    <img src="photo8.jpg" onclick="openImg(this)">
    <img src="photo9.jpg" onclick="openImg(this)">
  </div>
  <button onclick="clickFx();stopPhotos();menu()">BACK</button>
</section>

<!-- LETTER -->
<section id="letter" class="balloons">
  <img src="parrot.gif" width="120"><br><br>
  <div id="letterText" class="type"></div><br>
  <button onclick="clickFx();stopLetter();menu()">BACK</button>
</section>

<div class="modal" id="modal">
  <span onclick="closeImg()">✖</span>
  <img id="modalImg">
</div>

<script>
// click
function clickFx(){
  const c=document.getElementById("clickSound");
  c.currentTime=0;c.play();
}

// show
function show(id){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// music stop
function stopAll(){
  intro.pause();photosMusic.pause();letterMusic.pause();
}

// start
function start(){
  intro.play();
  show("introText");
  typeText("typed",
"Amira...\nToday is your birthday.\nSo I coded this interactive memory for you.\n(◕‿◕)っ🎔");
}

function toGift(){stopAll();show("gift")}
function backIntro(){stopAll();show("introText")}
function yes(){show("menu")}
function no(){show("nope")}
function menu(){stopAll();show("menu")}

// photos
function photos(){
  stopAll();photosMusic.play();show("photos")
}
function stopPhotos(){photosMusic.pause()}

// letter
function letter(){
  stopAll();letterMusic.play();show("letter");
  typeText("letterText",
"Hoy te celebro 🤍\n\nCelebro tu vida y este nuevo año, lleno de sorpresas y caminos por descubrir. Aunque nuestros mundos estén tan lejos, tú desde Argelia, yo desde un rincón de Latinoamérica, me maravilla la belleza de tu mundo: tu cultura, tu idioma, tu manera tan única de existir, tan distinta a la mía.\n\nMe alegra profundamente haberte conocido, desde aquel encuentro del año pasado. Ya te lo he dicho antes, pero de verdad me sorprende quién eres: cómo vives tu fe, lo amable y correcta que eres, la calma que transmites sin esfuerzo.\n\nDeseo que tu mente esté llena de sueños por cumplir y que tengas la valentía de vivir la vida con intensidad y libertad...\n\nGracias a Dios por tu existir. Te deseo salud, paz, felicidad y muchos momentos que te hagan sonreír… hoy y siempre."
  );
}
function stopLetter(){letterMusic.pause()}

// typing
function typeText(id,text){
  let i=0,el=document.getElementById(id);el.textContent="";
  let t=setInterval(()=>{
    el.textContent+=text[i];
    i++;if(i>=text.length)clearInterval(t)
  },35);
}

// images
function openImg(img){
  modal.style.display="flex";
  modalImg.src=img.src;
}
function closeImg(){modal.style.display="none"}

// matrix
const c=document.querySelector("canvas"),x=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;
let y=Array(300).fill(0);
function matrix(){
  x.fillStyle="rgba(0,0,0,.05)";
  x.fillRect(0,0,c.width,c.height);
  x.fillStyle="#0f0";
  y.forEach((v,i)=>{
    const t=Math.random()>0.5?"0":"1";
    x.fillText(t,i*10,v);
    y[i]=v>c.height?0:v+10;
  });
}
setInterval(matrix,50);
</script>

</body>
</html>
