<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amira 🤍</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: 'Trebuchet MS', sans-serif;
}

section {
  display: none;
  min-height: 100vh;
  padding: 25px;
  box-sizing: border-box;
  text-align: center;
}

.active {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform: scale(0.95);}
  to {opacity:1; transform: scale(1);}
}

button {
  background: #ffb6c1;
  border: none;
  padding: 18px 32px;
  border-radius: 30px;
  font-size: 1.2em;
  margin: 12px;
  cursor: pointer;
}

.big {
  font-size: 2.6em;
}

.typing {
  font-size: 1.25em;
  line-height: 1.8;
  white-space: pre-wrap;
}

.matrix {
  position: fixed;
  inset: 0;
  z-index: -1;
  opacity: 0.2;
}

.collage {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.collage img {
  width: 100%;
  border-radius: 15px;
  cursor: pointer;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 99;
}

.modal img {
  max-width: 90%;
  border-radius: 20px;
}

.close {
  position: absolute;
  top: 20px;
  right: 20px;
  font-size: 2em;
  cursor: pointer;
}

audio {
  width: 100%;
  margin: 12px 0;
}
</style>
</head>

<body>

<canvas class="matrix"></canvas>
<audio id="click" src="click.mp3"></audio>

<!-- INTRO -->
<section id="intro" class="active">
  <div class="big">🎂🎈</div>
  <div id="introText" class="typing"></div>
</section>

<!-- QUESTION -->
<section id="question">
  <h1 class="big">مرحبا أميرة 🤍</h1>
  <p>تحبي تفتحي هديتك؟</p>
  <button onclick="noThanks()">لا</button>
  <button onclick="yesPlease()">أكيد 🤍</button>
</section>

<!-- NO -->
<section id="nope">
  <p>نعدك تعجبك 😌</p>
  <img src="photo7.jpg" style="width:80%;border-radius:20px;">
  <button onclick="back()">جربي مرة أخرى</button>
</section>

<!-- MENU -->
<section id="menu">
  <h2 class="big">هديتك 🤍</h2>
  <button onclick="openPhotos()">📸 صور</button>
  <button onclick="openLetter()">💌 رسالة</button>
  <button onclick="back()">⬅ رجوع</button>
</section>

<!-- PHOTOS -->
<section id="photos">
  <h3>اسمعي الموسيقى وشوفي الذكريات 🤍</h3>
  <audio id="music" controls>
    <source src="music.mp3">
  </audio>

  <div class="collage">
    <img src="photo1.jpg" onclick="openImg(this)">
    <img src="photo2.jpg" onclick="openImg(this)">
    <img src="photo3.jpg" onclick="openImg(this)">
    <img src="photo4.jpg" onclick="openImg(this)">
    <img src="photo5.jpg" onclick="openImg(this)">
    <img src="photo6.jpg" onclick="openImg(this)">
    <img src="photo7.jpg" onclick="openImg(this)">
    <img src="photo8.jpg" onclick="openImg(this)">
    <img src="photo9.jpg" onclick="openImg(this)">
  </div>

  <button onclick="stopMusic(); backMenu()">⬅ رجوع</button>
</section>

<!-- LETTER -->
<section id="letter">
  <audio id="song" controls>
    <source src="song.mp3">
  </audio>

  <img src="parrot.gif" style="width:120px;margin:10px;">
  <div id="letterText" class="typing"></div>

  <button onclick="stopSong(); backMenu()">⬅ رجوع</button>
</section>

<div class="modal" id="modal">
  <span class="close" onclick="closeImg()">✕</span>
  <img id="modalImg">
</div>

<script>
const click = document.getElementById("click");
function sound(){ click.currentTime=0; click.play(); }

function show(id){
  sound();
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function noThanks(){ show('nope'); }
function yesPlease(){ show('menu'); }
function back(){ show('question'); }
function backMenu(){ show('menu'); }
function openPhotos(){ show('photos'); }
function openLetter(){ show('letter'); typeLetter(); }

function stopMusic(){
  music.pause();
  music.currentTime = 0;
}
function stopSong(){
  song.pause();
  song.currentTime = 0;
}

// INTRO
const intro =
"Amira...\n\nاليوم عيد ميلادك 🎂\n\nحبيت نبرمج ذكريات ليك 🤍";
let i=0;
function typeIntro(){
  if(i<intro.length){
    introText.innerHTML+=intro.charAt(i);
    i++;
    setTimeout(typeIntro,70);
  } else {
    setTimeout(()=>show('question'),2200);
  }
}
typeIntro();

// LETTER
const letter =
"اليوم نحتفل بيك 🤍\n\n"+
"نحتفل بحياتك وبسنة جديدة مليانة مفاجآت وطرق جديدة.\n"+
"حتى ولو عوالمنا بعيدة، إنتي من الجزائر وأنا من زاوية من أمريكا اللاتينية،\n"+
"يعجبني جمال عالمك: ثقافتك، لغتك، وطريقتك الخاصة في الوجود.\n\n"+
"فرحانة بزاف لأني تعرفت عليك من العام لي فات.\n"+
"دايمًا تدهشيني بإيمانك، بلطفك، وبالهدوء لي تعطيه بدون مجهود.\n\n"+
"نتمنى عقلك يكون عامر بالأحلام، وقلبك شجاع تعيشي الحياة بحرية.\n\n"+
"شكرا لوجودك 🤍\n"+
"نتمنالك صحة، سلام، سعادة، وضحكة دايمًا.";

let j=0;
function typeLetter(){
  letterText.innerHTML="";
  j=0;
  function t(){
    if(j<letter.length){
      letterText.innerHTML+=letter.charAt(j);
      j++;
      setTimeout(t,55);
    }
  }
  t();
}

// MODAL
function openImg(img){
  modal.style.display="flex";
  modalImg.src=img.src;
}
function closeImg(){
  modal.style.display="none";
}
</script>

</body>
</html>
