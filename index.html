<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Amira</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:black;
  color:#00ffcc;
  font-family:Courier, monospace;
  overflow-x:hidden;
}

canvas{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  z-index:0;
}

section{
  min-height:100vh;
  padding:30px 15px;
  display:none;
  position:relative;
  z-index:1;
  text-align:center;
}

.active{display:block}

h1{
  font-size:2.5rem;
  margin-bottom:15px;
}

h2{
  font-size:1.6rem;
  margin-bottom:15px;
}

button{
  font-size:1.2rem;
  padding:15px 25px;
  margin:10px;
  background:#00ffcc;
  color:black;
  border:none;
  border-radius:12px;
  cursor:pointer;
}

button:active{transform:scale(0.95)}

.big{
  font-size:3rem;
}

.matrixText{
  font-size:1.3rem;
  margin-top:20px;
  min-height:120px;
}

.torta{
  width:200px;
  margin:20px auto;
  animation:fadeIn 2s ease-in-out;
}

@keyframes fadeIn{
  from{opacity:0;transform:scale(0.8)}
  to{opacity:1;transform:scale(1)}
}

.timer{
  margin-top:10px;
  font-size:1.1rem;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-top:30px;
}

.card{
  background:rgba(0,0,0,0.6);
  padding:30px;
  border-radius:15px;
  font-size:1.5rem;
}

.gallery{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
}

.gallery img{
  width:45%;
  border-radius:10px;
  cursor:pointer;
}

.full{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:black;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:5;
}

.full img{
  max-width:90%;
  max-height:90%;
}

.close{
  position:absolute;
  top:20px;
  right:20px;
  font-size:2rem;
  color:white;
  cursor:pointer;
}

.letter{
  font-size:1.2rem;
  line-height:1.6;
  text-align:left;
  margin-top:20px;
}

.balloons{
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:0;
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<audio id="intro" src="cancion.mp3"></audio>
<audio id="song" src="song.mp3"></audio>
<audio id="click" src="click.mp3"></audio>

<!-- START -->
<section id="start" class="active">
  <h1 class="big">PRESS PLAY</h1>
  <button onclick="playIntro()">▶ PLAY</button>
</section>

<!-- TORTA -->
<section id="torta">
  <img src="torta.png" class="torta">
  <div class="matrixText" id="typeText"></div>
  <div class="timer" id="timer">wait… 15</div>
  <button id="nextBtn" disabled onclick="go('birthday')">NEXT</button>
</section>

<!-- QUESTION -->
<section id="birthday">
  <h1 class="big">🎉 HAPPY BIRTHDAY 👑</h1>
  <h2>Do you want to open your gift?</h2>
  <button onclick="yes()">Yes please</button>
  <button onclick="no()">No thanks</button>
  <button onclick="go('torta')">Return</button>
</section>

<!-- MENU -->
<section id="menu">
  <h1>THIS IS FOR YOU ⭐</h1>
  <div class="grid">
    <div class="card" onclick="openPhotos()">📸 Moments</div>
    <div class="card" onclick="openLetter()">💌 Letter</div>
    <div class="card" onclick="openGift()">🎁 Gift</div>
  </div>
  <button onclick="backMenu()">Return</button>
</section>

<!-- PHOTOS -->
<section id="photos">
  <h2>Moments ✨</h2>
  <div class="gallery">
    <img src="photo1.jpg" onclick="zoom(this)">
    <img src="photo2.jpg" onclick="zoom(this)">
    <img src="photo3.jpg" onclick="zoom(this)">
    <img src="photo4.jpg" onclick="zoom(this)">
  </div>
  <button onclick="backMenu()">Return</button>
</section>

<!-- LETTER -->
<section id="letter">
  <img src="parrot.gif" width="120">
  <div class="letter" id="letterText"></div>
  <button onclick="backMenu()">Return</button>
</section>

<!-- GIFT -->
<section id="gift">
  <h2>🎁</h2>
  <p>Los robux te llegarán el 15 de enero 💝</p>
  <img src="photo4.jpg" width="200">
  <button onclick="backMenu()">Return</button>
</section>

<div class="full" id="full">
  <span class="close" onclick="closeFull()">✕</span>
  <img id="fullImg">
</div>

<script>
/* MATRIX */
const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const bits=["0","1"];
const streams=[];
for(let i=0;i<canvas.width/40;i++){
  streams.push({
    x:i*40,
    y:Math.random()*canvas.height,
    speed:1+Math.random()*2,
    val:bits[Math.floor(Math.random()*2)]
  });
}

setInterval(()=>{
  ctx.fillStyle="rgba(0,0,0,0.15)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#00ff99";
  ctx.font="20px monospace";
  streams.forEach(s=>{
    ctx.fillText(s.val,s.x,s.y);
    s.y+=s.speed;
    if(Math.random()>0.98) s.val=bits[Math.floor(Math.random()*2)];
    if(s.y>canvas.height) s.y=-20;
  });
},60);

/* LOGIC */
const intro=document.getElementById("intro");
const song=document.getElementById("song");
const click=document.getElementById("click");

function sound(){click.play()}

function go(id){
  sound();
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function playIntro(){
  sound();
  intro.play();
  go("torta");
  typeWriter();
  startTimer();
}

function yes(){
  sound();
  intro.pause();
  go("menu");
}

function no(){
  sound();
  intro.pause();
  go("gift");
}

function openPhotos(){
  sound();
  song.currentTime=0;
  song.play();
  go("photos");
}

function openLetter(){
  sound();
  song.currentTime=0;
  song.play();
  go("letter");
  writeLetter();
}

function openGift(){
  sound();
  go("gift");
}

function backMenu(){
  song.pause();
  go("menu");
}

/* TYPING */
const text="Amira… Today is your birthday. I made this interactive coding for you 💻";
let i=0;
function typeWriter(){
  if(i<text.length){
    document.getElementById("typeText").innerHTML+=text.charAt(i);
    i++;
    setTimeout(typeWriter,80);
  }
}

/* TIMER */
let t=15;
function startTimer(){
  const el=document.getElementById("timer");
  const btn=document.getElementById("nextBtn");
  const int=setInterval(()=>{
    t--;
    el.innerText="wait… "+t;
    if(t<=0){
      clearInterval(int);
      btn.disabled=false;
      el.innerText="you can continue";
    }
  },1000);
}

/* LETTER */
const letter=`اليوم نحتفل بيك 🤍

نحتفل بحياتك وبهاد العام الجديد، عام مليان مفاجآت وطرق جديدة تكتشفيها. رغم اللي عوالمنا بعيدة بزاف — إنتِ من الجزائر وأنا من ركن صغير في أمريكا اللاتينية — دايمًا يعجبني جمال عالمك: ثقافتك، لغتك، وطريقتك الخاصة في الوجود، المختلفة بزاف عني.

فرحانة بزاف إني عرفتك، من ذاك اللقاء اللي كان العام اللي فات. قلتها لك قبل، وبصح لازم نعاود نقولها: فعلاً تدهشيني بشخصك، بطريقة عيشك لإيمانك، بلطفك، وبالهدوء اللي تنشريه من غير ما تحاولي. معرفتك كانت حاجة بسيطة بصح بقات في القلب، وتجربة مميزة بزاف.

نتمنى يكون بالك عامر بالأحلام اللي حابة تحققيها، ويكون عندك الشجاعة تعيشي حياتك بحرية وبعمق، خاطر هكذا نشوف معنى الحياة: نحسّ بلا خوف، نتعلم ونكبر في كل خطوة… ونخلي اللي صادق يلقى وقته وطريقه.

أمنياتي بزاف، حتى لو كلماتي قليلة.

نحمد ربي على وجودك، ونتمنالك الصحة، الراحة، السعادة، ولحظات بزاف تخليك تبتسمي… اليوم ودومًا.`;

let j=0;
function writeLetter(){
  const box=document.getElementById("letterText");
  box.innerHTML="";
  j=0;
  (function typing(){
    if(j<letter.length){
      box.innerHTML+=letter.charAt(j);
      j++;
      setTimeout(typing,60);
    }
  })();
}

/* IMAGES */
function zoom(img){
  document.getElementById("full").style.display="flex";
  document.getElementById("fullImg").src=img.src;
}
function closeFull(){
  document.getElementById("full").style.display="none";
}
</script>

</body>
</html>
