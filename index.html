<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amira 🤍</title>

<style>
body {
  margin: 0;
  font-family: 'Courier New', monospace;
  background: black;
  color: white;
  overflow-x: hidden;
}

section {
  display: none;
  min-height: 100vh;
  padding: 25px;
  box-sizing: border-box;
  text-align: center;
}

.active {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

button {
  background: #ffb6c1;
  border: none;
  padding: 18px 30px;
  border-radius: 25px;
  font-size: 1.2em;
  margin: 12px;
  cursor: pointer;
}

.big {
  font-size: 2.4em;
}

.typing {
  font-size: 1.2em;
  white-space: pre-wrap;
  line-height: 1.7;
}

.matrix {
  position: fixed;
  inset: 0;
  z-index: -1;
  opacity: 0.25;
}

.collage {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.collage img {
  width: 100%;
  border-radius: 15px;
  cursor: pointer;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 99;
}

.modal img {
  max-width: 90%;
  border-radius: 20px;
}

.close {
  position: absolute;
  top: 20px;
  right: 20px;
  font-size: 2em;
  cursor: pointer;
}

audio {
  width: 100%;
  margin: 15px 0;
}
</style>
</head>

<body>

<canvas class="matrix"></canvas>

<!-- INTRO -->
<section id="intro" class="active">
  <div class="big">🎂🎈</div>
  <div id="introText" class="typing"></div>
</section>

<!-- QUESTION -->
<section id="question">
  <h1 class="big">مرحبا أميرة 🤍</h1>
  <p>تحبي تفتحي هديتك؟</p>
  <button onclick="noThanks()">لا</button>
  <button onclick="yesPlease()">أكيد 🤍</button>
</section>

<!-- NO -->
<section id="nope">
  <p>نعدك تعجبك 😌</p>
  <img src="photo4.jpg" style="width:80%;border-radius:20px;">
  <button onclick="back()">جربي مرة أخرى</button>
</section>

<!-- MENU -->
<section id="menu">
  <h2 class="big">هذا ليك 🤍</h2>
  <button onclick="openPhotos()">📸 صور</button>
  <button onclick="openLetter()">💌 رسالة</button>
</section>

<!-- PHOTOS -->
<section id="photos">
  <audio controls>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div class="collage">
    <img src="photo1.jpg" onclick="openImg(this)">
    <img src="photo2.jpg" onclick="openImg(this)">
    <img src="photo3.jpg" onclick="openImg(this)">
    <img src="photo4.jpg" onclick="openImg(this)">
    <img src="photo5.jpg" onclick="openImg(this)">
    <img src="photo6.jpg" onclick="openImg(this)">
    <img src="photo7.jpg" onclick="openImg(this)">
    <img src="photo8.jpg" onclick="openImg(this)">
    <img src="photo9.jpg" onclick="openImg(this)">
  </div>

  <button onclick="backMenu()">⬅ رجوع</button>
</section>

<!-- LETTER -->
<section id="letter">
  <audio controls>
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <img src="parrot.gif" style="width:120px;margin-bottom:10px;">

  <div id="letterText" class="typing"></div>

  <button onclick="backMenu()">⬅ رجوع</button>
</section>

<!-- IMAGE MODAL -->
<div class="modal" id="modal">
  <span class="close" onclick="closeImg()">✕</span>
  <img id="modalImg">
</div>

<script>
// MATRIX
const canvas = document.querySelector(".matrix");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;
const letters = "0101010101";
const drops = Array(60).fill(1);
function matrix() {
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "#ff69b4";
  drops.forEach((y,i)=>{
    const text = letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text,i*20,y*20);
    drops[i] = y*20 > canvas.height || Math.random() > 0.95 ? 0 : y+1;
  });
}
setInterval(matrix,50);

// INTRO TEXT
const intro =
"Amira...\n\nاليوم عيد ميلادك 🎂\n\nحبيت نبرمج شوية ذكريات ليك 🤍";
let i=0;
function typeIntro(){
  if(i<intro.length){
    introText.innerHTML+=intro.charAt(i);
    i++;
    setTimeout(typeIntro,70);
  } else {
    setTimeout(()=>show('question'),2500);
  }
}
typeIntro();

// NAV
function show(id){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function noThanks(){show('nope')}
function yesPlease(){show('menu')}
function back(){show('question')}
function backMenu(){show('menu')}
function openPhotos(){show('photos')}
function openLetter(){show('letter');typeLetter()}

// LETTER
const letter =
"اليوم نحتفل بيك 🤍\n\n"+
"نحتفل بحياتك وبسنة جديدة مليانة مفاجآت وطرق جديدة.\n"+
"حتى ولو عوالمنا بعيدة، إنتي من الجزائر وأنا من زاوية من أمريكا اللاتينية،\n"+
"يعجبني جمال عالمك: ثقافتك، لغتك، وطريقتك الخاصة في الوجود.\n\n"+
"فرحانة بزاف لأني تعرفت عليك من العام لي فات.\n"+
"دايمًا تدهشيني بإيمانك، بلطفك، وبالهدوء لي تعطيه بدون مجهود.\n\n"+
"نتمنى عقلك يكون عامر بالأحلام، وقلبك شجاع تعيشي الحياة بحرية.\n\n"+
"شكرا لوجودك 🤍\n"+
"نتمنالك صحة، سلام، سعادة، وضحكة دايمًا.";

let j=0;
function typeLetter(){
  letterText.innerHTML="";
  j=0;
  function t(){
    if(j<letter.length){
      letterText.innerHTML+=letter.charAt(j);
      j++;
      setTimeout(t,60);
    }
  }
  t();
}

// IMAGE MODAL
function openImg(img){
  modal.style.display="flex";
  modalImg.src=img.src;
}
function closeImg(){
  modal.style.display="none";
}
</script>

</body>
</html>
