<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Amira 🤍</title>

<style>
body {
  margin: 0;
  font-family: 'Courier New', monospace;
  background: #0d0d0d;
  color: #fff;
  text-align: center;
}

section {
  display: none;
  padding: 30px;
  min-height: 100vh;
  box-sizing: border-box;
}

.active {
  display: block;
}

button {
  background: #ffb6c1;
  border: none;
  padding: 15px 25px;
  border-radius: 20px;
  font-size: 1em;
  margin: 10px;
  cursor: pointer;
}

button:hover {
  background: #ffc0cb;
}

.typing {
  font-size: 1.2em;
  white-space: pre-wrap;
}

.big-title {
  font-size: 2.5em;
}

.collage {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.collage img {
  width: 100%;
  border-radius: 15px;
}

.card {
  background: #1a1a1a;
  border-radius: 20px;
  padding: 20px;
}
</style>
</head>

<body>

<!-- 1. PORTADA ROBÓTICA -->
<section id="intro" class="active">
  <div id="robotText" class="typing"></div>
  <p>💻(◕◡◕) 💻(◕◡◕) 💻(◕◡◕)</p>
</section>

<!-- 2. PREGUNTA -->
<section id="question">
  <h1 class="big-title">Hola Amira 🤍</h1>
  <p>¿Quieres abrir tu regalo?</p>
  <button onclick="noThanks()">No thanks</button>
  <button onclick="yesPlease()">Yes please</button>
</section>

<!-- 2B. NO THANKS -->
<section id="nope">
  <p>Prometo que te gustará 😌</p>
  <img src="photo4.jpg" style="width:80%;border-radius:20px;">
  <br><br>
  <button onclick="back()">Try again</button>
</section>

<!-- 3. MENÚ -->
<section id="menu">
  <h2>These are for you 🤍</h2>
  <button onclick="openPhotos()">📸 Photos</button>
  <button onclick="openLetter()">💌 Letter</button>
</section>

<!-- 4A. FOTOS -->
<section id="photos">
  <audio controls autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>
  <div class="collage">
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
    <img src="photo5.jpg">
    <img src="photo6.jpg">
    <img src="photo7.jpg">
    <img src="photo8.jpg">
    <img src="photo9.jpg">
  </div>
</section>

<!-- 4B. CARTA -->
<section id="letter">
  <audio controls autoplay loop>
    <source src="song.mp3" type="audio/mpeg">
  </audio>
  <div class="card">
    <div id="letterText" class="typing"></div>
  </div>
</section>

<script>
const introText =
"Amira...\n\nHoy es tu cumpleaños.\nAsí que hice esta codificación de recuerdos para ti :)";

let i = 0;
function typeIntro() {
  if (i < introText.length) {
    document.getElementById("robotText").innerHTML += introText.charAt(i);
    i++;
    setTimeout(typeIntro, 60);
  } else {
    setTimeout(() => {
      showSection("question");
    }, 3000);
  }
}
typeIntro();

function showSection(id) {
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function noThanks() { showSection("nope"); }
function yesPlease() { showSection("menu"); }
function back() { showSection("question"); }
function openPhotos() { showSection("photos"); }

function openLetter() {
  showSection("letter");
  typeLetter();
}

const letter =
"Hoy te celebro 🤍\n\n" +
"Celebro tu vida y este nuevo año, lleno de sorpresas y caminos por descubrir.\n\n" +
"Aunque nuestros mundos estén tan lejos, tú desde Argelia, yo desde un rincón de Latinoamérica,\n" +
"me maravilla la belleza de tu mundo: tu cultura, tu idioma, tu manera tan única de existir.\n\n" +
"Me alegra profundamente haberte conocido.\n\n" +
"Gracias a Dios por tu existir.\n\n" +
"Te deseo salud, paz, felicidad y muchos momentos que te hagan sonreír… hoy y siempre.";

let j = 0;
function typeLetter() {
  const el = document.getElementById("letterText");
  el.innerHTML = "";
  j = 0;
  function t() {
    if (j < letter.length) {
      el.innerHTML += letter.charAt(j);
      j++;
      setTimeout(t, 40);
    }
  }
  t();
}
</script>

</body>
</html>
